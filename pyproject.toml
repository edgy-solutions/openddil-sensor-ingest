[project]
name = "openddil-sensor-ingest"
version = "0.2.0"
description = "OpenDDIL Sensor Ingestion Gateway — Binary DIS Sidecar"
requires-python = ">=3.11"
dependencies = [
    "opendis==1.0",
    "confluent-kafka>=2.0.0,<3.0.0",
    "prometheus-client>=0.20.0,<1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "protobuf>=4.21.0",
    # ASTERIX decoder (ADR-0030 Phase 2). asterix4py is MIT and pure Python.
    # The better-known asterix-decoder (CroatiaControl) is GPL v2 and a C
    # extension; see asterix_ingestor.py for why that licence is disqualifying
    # for an in-process dependency of an MIT service.
    "asterix4py>=1.0.6,<2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
